name: Suiteness
description: Suiteness is a hotel booking platform specializing in connecting rooms
  and suites that hotels do not make public. Through partnerships with hotels, it
  surfaces adjoining rooms and suites - marked with a "+" symbol - so families and
  groups can book twice the space at roughly half the price of booking multiple standard
  rooms. It combines suite inventory, a concierge collaboration service, and a membership
  program. Suiteness is a consumer travel booking company backed by Bullpen Capital;
  it exposes no public developer API, SDK, or partner API surface at this time.
